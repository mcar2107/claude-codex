# Релиз standalone-бинарников по тегу `v<версия из package.json>`.
#
# Каждый таргет собирается и проверяется на своей ОС и архитектуре: кросс-компиляция не доказывает,
# что бинарник запускается (README, «Transport and builds»). Тесты офлайн, без учётных данных.
# Ассеты без версии в имени — `releases/latest/download/<имя>` и install.sh не зависят от версии.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    # Сборка и тесты идут минуты; зависший e2e не должен держать раннер до лимита GitHub в 6 часов.
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, target: bun-darwin-arm64, asset: darwin-arm64 }
          - { runner: macos-15-intel, target: bun-darwin-x64, asset: darwin-x64 }
          - { runner: ubuntu-24.04, target: bun-linux-x64, asset: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: bun-linux-arm64, asset: linux-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Версия Bun закреплена в scripts/standalone.ts вместе с BUN-LICENSE.md.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:standalone --target ${{ matrix.target }}
      - run: bun scripts/test.ts --standalone
      - run: bun run test:e2e

      - name: Package
        run: |
          name="claude-codex-${{ matrix.asset }}"
          mkdir -p release
          cp -R "artifacts/${{ matrix.target }}" "release/$name"
          tar -czf "release/$name.tar.gz" -C release "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-codex-${{ matrix.asset }}
          path: release/claude-codex-${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: claude-codex-*
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum claude-codex-*.tar.gz | tee SHA256SUMS

      # Версия с суффиксом (`0.1.0-dev.1`) — prerelease: `releases/latest` её не отдаёт.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
